spring.application.name=cod-reconciliation
server.port=${SERVER_PORT:8080}
spring.config.import=optional:file:.env[.properties]
app.environment=${APP_ENV:production}
security.hsts.enabled=${HSTS_ENABLED:false}

security.admin.username=${ADMIN_USERNAME}
security.admin.password-hash=${ADMIN_PASSWORD_HASH}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
